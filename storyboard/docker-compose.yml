services:
  storyboard:
    build: .
    image: bighack-storyboard:local
    container_name: bighack-storyboard
    working_dir: /app
    ports:
      - "127.0.0.1:8011:8008"      # bind to localhost only
    volumes:
      # App code + storyboard.yaml + generated artifacts (persisted to the repo).
      - ./:/app
      # The play's scene scripts (source of truth for scenes). Writable, because
      # the review page edits beats in place and writes them back to the .md.
      - "../03 - Script:/scripts"
      # The repo's git dir, READ-ONLY, for the in-app Scene Review (diff two
      # refs / a ref vs the working tree). Only read-only git plumbing is run.
      - "../.git:/gitdir:ro"
      # SSH key + known_hosts, read-only, so the container can reach the GPU host
      # WITHOUT installing anything on it. known_hosts keeps host-key verification on.
      - ${HOME}/.ssh:/root/.ssh:ro
      # OpenRouter key, read-only, single file (not the whole folder).
      - ../../ai_keys:/run/secrets/ai_keys:ro
    environment:
      - AI_KEYS_FILE=/run/secrets/ai_keys
      # Scenes are parsed from the mounted scripts folder (see volumes above).
      - SB_SCRIPTS_DIR=/scripts
      # Read-only git dir for the Scene Review feature (see volumes above).
      - SB_GIT_DIR=/gitdir
    restart: unless-stopped
