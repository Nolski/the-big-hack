    audio: music/s07.wav
  setting_audio: narration/s07_setting.wav
- id: s08
  number: 8
  title: The Win We Needed
  movement: III · Liam
  world: modern
  beat: B5
  status: drafted
  setting: All-hands. The agent rollout becomes the mandate. No live speaker — Liam silent below.
  narration: The numbers came in green. And green has a gravity all its own.
  sketch:
    prompt: >-
      A company all-hands meeting, a large dashboard of green metrics on screen, a CEO
      presenting warmly, an applauding audience in silhouette, one developer sitting
      still and silent in the front row.
    image: sketches/s08.png
  lines:
  - id: l1
    type: video
    speaker: kristina
    text: >-
      So — the agent rollout. The numbers are real: activation's up, support tickets
      are down, sentiment's green across the board. I do want to be fair to the
      engineers, though. The senior folks have raised concerns — code going in unread,
      long-lived keys, the juniors not really learning the craft. Those aren't nothing.
    direction: Proud, then honestly hedging.
    audio: lines/s08_l1.wav
  - id: l2
    type: video
    speaker: ceo
    text: >-
      No, they're not nothing. I hear them, I do. But I just came out of a board
      meeting looking at our runway, and this is the first quarter the line went the
      right way. This is the one we needed. I can't walk back in there and tell them
      some of the engineers have reservations.
    direction: Warm, fear underneath.
    audio: lines/s08_l2.wav
  - id: l3
    type: video
    speaker: ceo
    text: So from Monday — we're agent-first. Everything routes through the agent. Humans review.

    audio: lines/s08_l3.wav
  narration_audio: narration/s08.wav
  music:
    prompt: >-
      Cold, minimal ambient corporate-tech underscore. Sparse synth pads, low
      electronic drone, subtle unease, slow and spacious, no drums, no melody.
      Modern, clinical, the quiet hum of an open-plan office.
    audio: music/s08.wav
  setting_audio: narration/s08_setting.wav
- id: s09
  number: 9
  title: Adopt the Agent (All-Hands)
  movement: III · Liam
  world: modern
  beat: B5
  status: stub
  setting: The mandate lands on the floor; Marcus becomes its evangelist.
  narration: Every revolution needs its early believers. They are rarely the ones who built the old world.
  sketch:
    prompt: >-
      A young confident developer presenting enthusiastically to coworkers about an AI
      tool, hands wide, others nodding, one older developer at the edge unconvinced.
    image: sketches/s09.png
