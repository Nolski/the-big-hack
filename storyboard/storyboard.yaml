meta:
  title: The Big Hack
  subtitle: A Kiwicon talk staged as a play. Two men, two centuries, one machine.
  version: 1

settings:
  tts:
    host: duster@192.168.0.237
    python: /home/duster/miniconda3/envs/flash311/bin/python
    workdir: /home/duster/wan2.2_test
    # GPU 0 holds a 70B LLM but has the most spare VRAM; "auto" picks the freest card.
    gpu: auto
    design_model: Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign
    clone_model: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    language: English
  music:
    # Best open-source music model that fits the spare VRAM here (MusicGen, via
    # transformers). Falls back to medium/small automatically if VRAM is tight.
    model: facebook/musicgen-medium
    seconds: 24
    # Period-accurate base styles by world; a scene's own music.prompt overrides this.
    styles:
      modern: >-
        Cold, minimal ambient corporate-tech underscore. Sparse synth pads, low
        electronic drone, subtle unease, slow and spacious, no drums, no melody.
        Modern, clinical, the quiet hum of an open-plan office.
      historical: >-
        Early nineteenth century English folk, Georgian era, period accurate.
        Solo fiddle and gentle acoustic guitar, sparse and melancholic, a lone
        plaintive folk melody, no drums, no modern instruments.
      both: >-
        Two eras blending into one: a lone period fiddle folk melody over a cold
        modern synth drone, melancholic and building, sparse, cinematic.
      frame: >-
        Neutral, restrained documentary underscore, soft sustained strings, a
        sense of looking back across time, sparse and quiet.
  image:
    model: google/gemini-2.5-flash-image
    # Prepended to every scene sketch prompt for a consistent look.
    style: >-
      Black and white pencil storyboard sketch for a stage play, loose expressive
      graphite linework, cinematic single-frame composition, dramatic theatrical
      lighting, no text, no captions, no color, hand-drawn look.
    portrait_style: >-
      Black and white pencil character study, single figure, expressive graphite
      lines, theatrical lighting, neutral background, no text, no color.

# ---------------------------------------------------------------------------
# CHARACTERS
# voice.mode: "design" (describe the voice) or "clone" (mimic a ref wav).
# voice.seed changes the take/delivery; voice.instruct is the voice identity.
# ---------------------------------------------------------------------------
characters:
- id: narrator
  name: Narrator
  world: frame
  role: narration
  medium: voiceover
  live: false
  description: Neutral, disembodied narration that bridges the 200-year rewind and frames scenes.
  voice:
    mode: xvector
    seed: 42
    instruct: >-
      A calm, neutral documentary narrator. Measured, unhurried, clear. Gender-neutral
      to soft male timbre, plain modern English, no theatrics, no salesy energy. The
      voice of a thoughtful history film.
    sample_text: The North of England. The spring of eighteen twelve.

    sample: voices/narrator.wav
    vector: vectors/narrator.npy
- id: liam
  name: Liam
  world: modern
  role: protagonist
  medium: live-actor
  live: true
  description: A brilliant, exacting software developer who loves the craft and cannot survive in a world that decided it no longer needs him.
  voice:
    mode: xvector
    seed: 101
    instruct: >-
      A precise, slightly irritable male software engineer in his late thirties.
      Flat, controlled affect that occasionally bursts. Plain modern American English,
      clipped and exact, faintly condescending when correcting people. Not theatrical,
      not a narrator — a real tired smart guy in a meeting.
    sample_text: That's not a bug. That's undefined behaviour.

    sample: voices/liam.wav
    vector: vectors/liam.npy
- id: john
  name: John
  world: historical
  role: protagonist
  medium: live-actor
  live: true
  description: A skilled handloom weaver and steady family man in 1810s Yorkshire, unmade by the power loom.
  voice:
    mode: xvector
    seed: 202
    instruct: >-
      A warm, plain-spoken man of about forty from the north of England, a Yorkshire
      weaver. Unhurried, gentle, grounded, concrete. A soft northern English accent,
      chapel-going, kind. Talks like an ordinary working man, not an actor.
    sample_text: Forty years my family has worked this loom.

    sample: voices/john.wav
    vector: vectors/john.npy
- id: kristina
  name: Kristina
  world: modern
  role: supporting
  medium: ai-video
  live: false
  description: The PM/manager. Velocity over craft, the smiling axe. Kind and useless.
  voice:
    mode: xvector
    seed: 303
    instruct: >-
      A brisk, upbeat female product manager in her thirties, American. Warm, friendly
      delivery-speak full of corporate optimism and gentle management euphemism. Sounds
      genuinely nice and completely immovable. Conversational, not a narrator.
    sample_text: I want to be transparent with you, because I respect you.

    sample: voices/kristina.wav
    vector: vectors/kristina.npy
- id: brendan
  name: Brendan
  world: modern
  role: supporting
  medium: ai-video
  live: false
  description: The empathetic adopter. The one colleague who doesn't hate Liam; conflicted but complicit.
  voice:
    mode: xvector
    seed: 404
    instruct: >-
      An open, modest, conciliatory young male engineer, late twenties, American.
      Soft-spoken, earnest, a little nervous, reaches to collaborate even mid-conflict.
      Ordinary and likeable, not polished.
    sample_text: Maybe we could go through it together?

    sample: voices/brendan.wav
    vector: vectors/brendan.npy
- id: ceo
  name: The CEO
  world: modern
  role: supporting
  medium: ai-video
  live: false
  description: The pressure from above. Not greed but fear; the decent man at the top of the machine.
  voice:
    mode: xvector
    seed: 505
    instruct: >-
      A warm, big-picture male startup founder in his forties, American. Optimistic,
      reassuring, charismatic, with an undercurrent of fear and exhaustion he is trying
      to keep out of his voice. Sincere, never a tyrant.
    sample_text: This is the one we needed.

    sample: voices/ceo.wav
    vector: vectors/ceo.npy
- id: marcus
  name: Marcus
  world: modern
  role: supporting
  medium: ai-video
  live: false
  description: The fast adopter and active betrayer. Ambitious, reading the wind correctly.
  voice:
    mode: xvector
    seed: 606
    instruct: >-
      A fluent, optimistic, conference-ready young male developer, late twenties,
      American. Confident, fast, talks in velocity and vibes. Smooth and self-assured.
    sample_text: Honestly, the agent just unblocks everyone. It's a different game now.

    sample: voices/marcus.wav
    vector: vectors/marcus.npy
- id: sam
  name: Sam
  world: modern
  role: supporting
  medium: ai-video
  live: false
  description: The friend who goes quiet. The betrayal that hurts most is silence.
  voice:
    mode: xvector
    seed: 707
    instruct: >-
      A friendly, conflict-averse male coworker, thirties, American. Agreeable, a bit
      vague, says "yeah, totally" a lot, then goes absent. Warm but evasive.
    sample_text: Yeah. Yeah, totally. We should — we should catch up.

    sample: voices/sam.wav
    vector: vectors/sam.npy
- id: hr
  name: HR / People Partner
  world: modern
  role: supporting
  medium: ai-video
  live: false
  description: The system. Pure process and euphemism; the human face of an inhuman procedure.
  voice:
    mode: xvector
    seed: 808
    instruct: >-
      A scripted, gentle, immovable female HR business partner, American. Soft,
      rehearsed compassion, says "unfortunately" and "I want to acknowledge" a lot.
      Kind tone, zero give.
    sample_text: Unfortunately, your role has been impacted.

    sample: voices/hr.wav
    vector: vectors/hr.npy
- id: agent
  name: THE AGENT
  world: modern
  role: machine
  medium: ai-video
  live: false
  description: The AI coding agent. Cheerful, tireless, genuinely capable, therefore terrifying.
  voice:
    mode: xvector
    seed: 909
    instruct: >-
      A warm, corporate-synthetic AI assistant voice, gender-neutral, always positive,
      slightly too eager and tireless. Smooth and friendly with a faint synthetic
      evenness underneath, like a helpful product that never blinks.
    sample_text: Hi Liam! Want me to take it from here?

    sample: voices/agent.wav
    vector: vectors/agent.npy
- id: mary
  name: Mary
  world: historical
  role: supporting
  medium: ai-video
  live: false
  description: John's wife. The stake made flesh; the household whose hunger turns John.
  voice:
    mode: xvector
    seed: 1010
    instruct: >-
      A warm, practical, plain-spoken northern English woman of about thirty-five.
      Tender and tired, counts the world in loaves and candles. Soft Yorkshire accent,
      affectionate, real — sympathetic, never uncanny.
    sample_text: John, the bread's out, and the tea's going cold.

    sample: voices/mary.wav
    vector: vectors/mary.npy
- id: cartwright
  name: Mr. Cartwright
  world: historical
  role: supporting
  medium: ai-video
  live: false
  description: The mill owner. Affable, modern, certain he is being reasonable. The historical Kristina.
  voice:
    mode: xvector
    seed: 1111
    instruct: >-
      An affable, improving English gentleman mill owner of the early 1800s, fifties.
      Enlightened, faintly evangelical about machinery and efficiency, genuinely fond
      and genuinely puzzled anyone's upset. Educated English accent, never a sneer.
    sample_text: And do you think I set the price? Manchester sets the price.

    sample: voices/cartwright.wav
    vector: vectors/cartwright.npy
- id: becker
  name: Becker
  world: historical
  role: supporting
  medium: ai-video
  live: false
  description: The young frame-breaker. Names the loom as the enemy and pulls John toward action.
  voice:
    mode: xvector
    seed: 1212
    instruct: >-
      A hot, vivid, righteous young northern English weaver, early twenties. Angry,
      charismatic, urgent, the recruiter's certainty. Strong Yorkshire accent, fast
      and burning.
    sample_text: One lad to mind a dozen of 'em. One lad!

    sample: voices/becker.wav
    vector: vectors/becker.npy
- id: magistrate
  name: The Magistrate
  world: historical
  role: supporting
  medium: ai-video
  live: false
  description: The law closing ranks. Receives John's lawful petition with cold courtesy.
  voice:
    mode: xvector
    seed: 1313
    instruct: >-
      A cold, courteous, authoritative English official of the early 1800s, sixties.
      Clipped, superior, the law as euphemism, contempt under perfect manners.
      Refined English accent.
    sample_text: The law is the law. I'd advise you to remember it.

    sample: voices/magistrate.wav
    vector: vectors/magistrate.npy
- id: loom
  name: THE LOOM
  world: historical
  role: machine
  medium: sound
  live: false
  description: The power loom / factory as a character. Rhythmic, iron, faceless; begins as marvel, becomes Moloch.
  voice:
    mode: xvector
    seed: 1414
    instruct: >-
      A low, rhythmic, mechanical voice, half-machine half-choir, cold and tireless and
      faintly menacing, like iron learning to speak. Even, relentless, inhuman.
    sample_text: Faster. Cheaper. Always. Faster.

# ---------------------------------------------------------------------------
# SCENES (running order from "Structure & Scene Map")
# line.type: live | video | narration | direction
# line.speaker: a character id (for live/video) — narration uses the narrator voice
# ---------------------------------------------------------------------------
    sample: voices/loom.wav
    vector: vectors/loom.npy
- id: liam's dad
  name: liam's dad
  world: modern
  role: supporting
  medium: ai-video
  live: false
  description: ''
  voice:
    mode: design
    seed: 42
    instruct: 'insufferable arrogant and whiney '
    sample_text: ''
    sample: voices/liam's dad.wav
  portrait: portraits/liam's dad.png
scenes:
- id: s01
  number: 1
  title: Cold Open — The Standup
  movement: I · Liam
  world: modern
  beat: B2
  status: drafted
  setting: A morning standup. Coworker video tiles in a grid. Liam is the one black square.
  music:
    prompt: >-
      Cold minimal corporate-tech ambient, a single repeating muted synth pulse,
      low drone, faint unease under forced cheer, no drums, slow and clinical.
    audio: music/s01.wav
  narration: ""
  sketch:
    prompt: >-
      A modern open-plan tech office at morning standup; a grid of glowing video-call
      tiles on a big screen, smiling coworkers, one tile a blank black square; a lone
      developer's desk in the foreground, tense atmosphere.
    image: sketches/s01.png
  lines:
  - id: l1
    type: video
    speaker: kristina
    text: >-
      Morning, everyone — quick one today, lots to get through. Huge week: the new
      developer portal shipped Friday and the feedback is the best we've had on
      anything. Brendan basically lived here all weekend to land it — thank you,
      Brendan, seriously.
    direction: Mid-standup, smiling.
    audio: lines/s01_l1.wav
  - id: l2
    type: video
    speaker: brendan
    text: >-
      Oh — thanks. It went out clean, it's stable in prod. I used Claude Code,
      Opus four point eight, for most of it. Happy to walk anyone through it.
    direction: Modest glow.
    audio: lines/s01_l2.wav
  - id: l3
    type: live
    speaker: liam
    text: Quick thing. The "brief" thing we shipped Friday is corrupting timestamps in prod.
    direction: Flat, over the last seconds of the clip.
    audio: lines/s01_l3.wav
  - id: l4
    type: video
    speaker: kristina
    text: Okay — let's not derail standup, we can take that offline—
    direction: Smile holding.
    audio: lines/s01_l4.wav
  - id: l5
    type: live
    speaker: liam
    text: >-
      It's eight hundred lines nobody read. It authenticates with a long-lived API
      key in plaintext. That's not a style nit. That's a credential sitting in a log.
    audio: lines/s01_l5.wav
  - id: l6
    type: video
    speaker: brendan
    text: I— maybe we could go through it together? I'm sure there's—
    direction: Nervous.
    audio: lines/s01_l6.wav
  - id: l7
    type: video
    speaker: kristina
    text: >-
      The API-key call was deliberate, actually — keys convert better than OAuth,
      we have the numbers.
    direction: Owning it.
    audio: lines/s01_l7.wav
  - id: l8
    type: live
    speaker: liam
    text: Right. And when the key leaks, the numbers will be great for whoever finds it.
    audio: lines/s01_l8.wav
  - id: l9
    type: direction
    speaker: ""
    text: Silence on the grid. Kristina opens her mouth, closes it. Cut — straight into the rewind.

  setting_audio: narration/s01_setting.wav
- id: s02
  number: 2
  title: The Loom and the Guild — John half
  movement: II · John
  world: historical
  beat: B1+B2
  status: drafted
  setting: A weaving village, spring 1812. John at his cottage handloom by the window.
  music:
    prompt: >-
      Warm gentle early 1800s English folk, solo fiddle and acoustic guitar, the
      soft rhythmic clack of a handloom as percussion, pastoral and content, period
      accurate Georgian cottage music, melancholic undertone.
    audio: music/s02.wav
  narration: >-
    The north of England. The spring of eighteen twelve. In a weaving village, the
    cloth is still made by hand, in the home, at a man's own pace.
  sketch:
    prompt: >-
      A 19th-century English cottage interior, a handloom weaver at a wooden loom beside
      a small window with daylight, woven cloth, humble warm domestic space; through the
      window, faint smoke of a distant factory in the valley.
    image: sketches/s02.png
  lines:
  - id: l1
    type: live
    speaker: john
    text: >-
      Forty years my family's worked this loom. My father's father set it by that
      window so he could see the weather coming.
    direction: To audience.
    audio: lines/s02_l1.wav
  - id: l2
    type: video
    speaker: mary
    text: >-
      John — bread's out, and the tea's going cold. The boy's been asking again when
      he gets a loom of his own.
    direction: In the kitchen window. Warm, unbothered.
    audio: lines/s02_l2.wav
  - id: l3
    type: live
    speaker: john
    text: Tell him when his arms reach the treadles. Not a day before.
    audio: lines/s02_l3.wav
  - id: l4
    type: video
    speaker: becker
    text: >-
      John — you hear? Cartwright's putting up a shed of steam-looms down the valley.
      One lad to mind a dozen of 'em. One lad.
    direction: At the gate, worried not yet angry.
    audio: lines/s02_l4.wav
  - id: l5
    type: live
    speaker: john
    text: Folk'll always want good cloth, lad. Honest cloth.
    audio: lines/s02_l5.wav
  - id: l6
    type: video
    speaker: becker
    text: And when they buy the cheap stuff anyway? What then?
    audio: lines/s02_l6.wav
  - id: l7
    type: video
    speaker: loom
    text: Faster. Cheaper. Always.
    direction: Far off, under everything — a faint iron knock down the valley.

    audio: lines/s02_l7.wav
  narration_audio: narration/s02.wav
  setting_audio: narration/s02_setting.wav
- id: s03
  number: 3
  title: The Demo — John half
  movement: II · John
  world: historical
  beat: B3
  status: stub
  setting: Cartwright unveils the power loom to the village.
  narration: A few miles off, the future was being switched on, and called a marvel.
