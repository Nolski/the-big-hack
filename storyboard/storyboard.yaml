- id: s06
  number: 6
  title: The Demo — Liam half
  movement: III · Liam
  world: modern
  beat: B3
  status: stub
  setting: The agent demos itself solving Liam's hard problem in seconds.
  narration: Two hundred years on, the marvel had a friendlier face.
  sketch:
