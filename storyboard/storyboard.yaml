- id: s07
  number: 7
  title: Liam Solves the Unsolvable
  movement: III · Liam
  world: modern
  beat: B4
  status: stub
  setting: Liam's last great solo win — the work he was born for.
  narration: He had one more good day in him. He didn't know it was the last.
  sketch:
    prompt: >-
