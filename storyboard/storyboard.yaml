  lines:
  - id: l1
    type: video
    speaker: cartwright
    text: >-
      Come closer, come closer — don't be shy of it. This one machine does the work
      of ten good men, and never tires, and never asks for Sunday.
    direction: Unveiling, to applause.

    audio: lines/s03_l1.wav
  narration_audio: narration/s03.wav
