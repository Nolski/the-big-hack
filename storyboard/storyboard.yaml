meta:
  title: The Big Hack
  subtitle: A Kiwicon talk staged as a play. Two men, two centuries, one machine.
  version: 2

# ---------------------------------------------------------------------------
# CONFIG
# Scenes are NOT stored here anymore — they are parsed live from the play's
# script markdown (settings.scripts_dir, the vault's "03 - Script" folder).
# This file holds only the cast (voices) + generation settings.
#
# Every value under settings.tts / music / image can be overridden at runtime
# by an environment variable, so a different operator can point the app at
# THEIR own GPU box / model without editing this file:
#   SB_TTS_HOST, SB_TTS_PYTHON, SB_TTS_WORKDIR, SB_TTS_GPU,
#   SB_TTS_DESIGN_MODEL, SB_TTS_CLONE_MODEL, SB_TTS_LANGUAGE,
#   SB_MUSIC_MODEL, SB_MUSIC_SECONDS, SB_IMAGE_MODEL, SB_SCRIPTS_DIR
# ---------------------------------------------------------------------------
settings:
  # Where the scene scripts live (relative to this file, or absolute).
  scripts_dir: ../03 - Script
  tts:
    # Connection details are intentionally left as placeholders — set your own
    # GPU box via env vars (SB_TTS_HOST / SB_TTS_PYTHON / SB_TTS_WORKDIR) or a
    # local, untracked docker-compose.override.yml. See README.
    host: user@your-gpu-host
    python: /path/to/python
    workdir: /path/to/workdir
    # "auto" picks the freest CUDA device on the host.
    gpu: auto
    design_model: Qwen/Qwen3-TTS-12Hz-1.7B-VoiceDesign
    clone_model: Qwen/Qwen3-TTS-12Hz-1.7B-Base
    language: English
  music:
    # Best open-source music model that fits the spare VRAM here (MusicGen, via
    # transformers). Falls back to medium/small automatically if VRAM is tight.
    model: facebook/musicgen-medium
    seconds: 24
    # Period-accurate base styles by world; a scene's own music.prompt overrides this.
    styles:
      modern: >-
        Cold, minimal ambient corporate-tech underscore. Sparse synth pads, low
        electronic drone, subtle unease, slow and spacious, no drums, no melody.
        Modern, clinical, the quiet hum of an open-plan office.
      historical: >-
        Early nineteenth century English folk, Georgian era, period accurate.
        Solo fiddle and gentle acoustic guitar, sparse and melancholic, a lone
        plaintive folk melody, no drums, no modern instruments.
      both: >-
        Two eras blending into one: a lone period fiddle folk melody over a cold
        modern synth drone, melancholic and building, sparse, cinematic.
      frame: >-
        Neutral, restrained documentary underscore, soft sustained strings, a
        sense of looking back across time, sparse and quiet.
  image:
    model: google/gemini-2.5-flash-image
    # Prepended to every scene sketch prompt for a consistent look.
    style: >-
      Black and white pencil storyboard sketch for a stage play, loose expressive
      graphite linework, cinematic single-frame composition, dramatic theatrical
      lighting, no text, no captions, no color, hand-drawn look.
    portrait_style: >-
      Black and white pencil character study, single figure, expressive graphite
      lines, theatrical lighting, neutral background, no text, no color.

# ---------------------------------------------------------------------------
# CHARACTERS
# voice.mode: "design" (describe the voice), "xvector" (locked speaker vector),
# or "clone" (mimic a ref wav). voice.seed changes the take/delivery.
# A character is matched to a script speaker by id or name (see script_parser).
# ---------------------------------------------------------------------------
characters:
- id: narrator
  name: Narrator
  world: frame
  role: narration
  medium: voiceover
  live: false
  description: Neutral, disembodied narration that bridges the 200-year rewind and frames scenes.
  voice:
    mode: xvector
    seed: 42
    instruct: >-
      A calm, neutral documentary narrator. Measured, unhurried, clear. Gender-neutral
      to soft male timbre, plain modern English, no theatrics, no salesy energy. The
      voice of a thoughtful history film.
    sample_text: The North of England. The spring of eighteen twelve.
    sample: voices/narrator.wav
    vector: vectors/narrator.npy
- id: liam
  name: Liam
  world: modern
  role: protagonist
  medium: live-actor
  live: true
  description: A brilliant, exacting software developer who loves the craft and cannot survive in a world that decided it no longer needs him.
  voice:
    mode: xvector
    seed: 101
    instruct: >-
      A precise, slightly irritable male software engineer in his late thirties.
      Flat, controlled affect that occasionally bursts. Plain modern American English,
      clipped and exact, faintly condescending when correcting people. Not theatrical,
      not a narrator — a real tired smart guy in a meeting.
    sample_text: That's not a bug. That's undefined behaviour.
    sample: voices/liam.wav
    vector: vectors/liam.npy
- id: john
  name: John
  world: historical
  role: protagonist
  medium: live-actor
  live: true
  description: A skilled handloom weaver and steady family man in 1810s Yorkshire, unmade by the power loom.
  voice:
    mode: xvector
    seed: 202
    instruct: >-
      A warm, plain-spoken man of about forty from the north of England, a Yorkshire
      weaver. Unhurried, gentle, grounded, concrete. A soft northern English accent,
      chapel-going, kind. Talks like an ordinary working man, not an actor.
    sample_text: Forty years my family has worked this loom.
    sample: voices/john.wav
    vector: vectors/john.npy
- id: kristina
  name: Kristina
  world: modern
  role: supporting
  medium: ai-video
  live: false
  description: The PM/manager. Velocity over craft, the smiling axe. Kind and useless.
  voice:
    mode: xvector
    seed: 303
    instruct: >-
      A brisk, upbeat female product manager in her thirties, American. Warm, friendly
      delivery-speak full of corporate optimism and gentle management euphemism. Sounds
      genuinely nice and completely immovable. Conversational, not a narrator.
    sample_text: I want to be transparent with you, because I respect you.
    sample: voices/kristina.wav
    vector: vectors/kristina.npy
- id: brendan
  name: Brendan
  world: modern
  role: supporting
  medium: ai-video
  live: false
  description: The empathetic adopter. The one colleague who doesn't hate Liam; conflicted but complicit.
  voice:
    mode: xvector
    seed: 404
    instruct: >-
      An open, modest, conciliatory young male engineer, late twenties, American.
      Soft-spoken, earnest, a little nervous, reaches to collaborate even mid-conflict.
      Ordinary and likeable, not polished.
    sample_text: Maybe we could go through it together?
    sample: voices/brendan.wav
    vector: vectors/brendan.npy
- id: ceo
  name: The CEO
  world: modern
  role: supporting
  medium: ai-video
  live: false
  description: The pressure from above. Not greed but fear; the decent man at the top of the machine.
  voice:
    mode: xvector
    seed: 505
    instruct: >-
      A warm, big-picture male startup founder in his forties, American. Confident and
      unmistakably authoritative, but lightly playful: quick flashes of dry humor, an
      easy grin in the voice, and the relaxed charisma of someone who enjoys the people
      in the room. Optimistic and reassuring, with an undercurrent of fear and exhaustion
      he keeps out of his voice. Conversational and lively, never goofy, salesy, or
      tyrannical; when the stakes surface, the authority lands cleanly.
    sample_text: There she is. Sit. Tell me those numbers are real — I could use one good surprise this quarter.
    sample: voices/ceo.wav
    vector: vectors/ceo.npy
- id: marcus
  name: Marcus
  world: modern
  role: supporting
  medium: ai-video
  live: false
  description: Another engineer on the team. Ships fast by accepting what the agent writes; in the Scene 11b standup he unmutes to defend himself and turns out to be exactly as stubborn as Liam, and far more annoying.
  voice:
    mode: xvector
    seed: 909
    instruct: >-
      An insufferably condescending male software engineer, late forties, American.
      Nasal, adenoidal, pinched voice, slightly congested. Patronizing sing-song
      delivery where every sentence lands like a correction. Smug, unhurried,
      faux-polite, whiny, grating. Never raises his volume, which makes it worse.
      The coworker everyone mutes.
    sample_text: Sorry — quick flag. I'm just going to say it. Nobody can audit eighty billion numbers, Liam. Nobody. And I want it noted that I flagged it.
    sample: voices/marcus.wav
    vector: vectors/marcus.npy
  portrait: portraits/marcus.png
- id: sam
  name: Sam
  world: modern
  role: supporting
  medium: ai-video
  live: false
  description: The friend who goes quiet. The betrayal that hurts most is silence.
  voice:
    mode: xvector
    seed: 707
    instruct: >-
      A friendly, conflict-averse male coworker, thirties, American. Agreeable, a bit
      vague, says "yeah, totally" a lot, then goes absent. Warm but evasive.
    sample_text: Yeah. Yeah, totally. We should — we should catch up.
    sample: voices/sam.wav
    vector: vectors/sam.npy
- id: hr
  name: HR / People Partner
  world: modern
  role: supporting
  medium: ai-video
  live: false
  description: The system. Pure process and euphemism; the human face of an inhuman procedure.
  voice:
    mode: xvector
    seed: 808
    instruct: >-
      A scripted, gentle, immovable female HR business partner, American. Soft,
      rehearsed compassion, says "unfortunately" and "I want to acknowledge" a lot.
      Kind tone, zero give.
    sample_text: Unfortunately, your role has been impacted.
    sample: voices/hr.wav
    vector: vectors/hr.npy
- id: mary
  name: Mary
  world: historical
  role: supporting
  medium: ai-video
  live: false
  description: John's wife. The stake made flesh; the household whose hunger turns John.
  voice:
    mode: xvector
    seed: 1010
    instruct: >-
      A warm, practical, plain-spoken northern English woman of about thirty-five.
      Tender and tired, counts the world in loaves and candles. Soft Yorkshire accent,
      affectionate, real — sympathetic, never uncanny.
    sample_text: John, the bread's out, and the tea's going cold.
    sample: voices/mary.wav
    vector: vectors/mary.npy
- id: cartwright
  name: Mr. Cartwright
  world: historical
  role: supporting
  medium: ai-video
  live: false
  description: The mill owner. Affable, modern, certain he is being reasonable. The historical Kristina.
  voice:
    mode: xvector
    seed: 1111
    instruct: >-
      An affable, improving English gentleman mill owner of the early 1800s, fifties.
      Enlightened, faintly evangelical about machinery and efficiency, genuinely fond
      and genuinely puzzled anyone's upset. Educated English accent, never a sneer.
    sample_text: And do you think I set the price? Manchester sets the price.
    sample: voices/cartwright.wav
    vector: vectors/cartwright.npy
- id: becker
  name: Becker
  world: historical
  role: supporting
  medium: ai-video
  live: false
  description: The young frame-breaker. Names the loom as the enemy and pulls John toward action. Appears first as the un-radicalised "young weaver."
  voice:
    mode: xvector
    seed: 1212
    instruct: >-
      A hot, vivid, righteous young northern English weaver, early twenties. Angry,
      charismatic, urgent, the recruiter's certainty. Strong Yorkshire accent, fast
      and burning.
    sample_text: One lad to mind a dozen of 'em. One lad!
    sample: voices/becker.wav
    vector: vectors/becker.npy
- id: magistrate
  name: The Magistrate
  world: historical
  role: supporting
  medium: ai-video
  live: false
  description: The law closing ranks. Receives John's lawful petition with cold courtesy.
  voice:
    mode: xvector
    seed: 1313
    instruct: >-
      A cold, courteous, authoritative English official of the early 1800s, sixties.
      Clipped, superior, the law as euphemism, contempt under perfect manners.
      Refined English accent.
    sample_text: The law is the law. I'd advise you to remember it.
    sample: voices/magistrate.wav
    vector: vectors/magistrate.npy
- id: liam's dad
  name: liam's dad
  world: modern
  role: supporting
  medium: ai-video
  live: false
  description: ''
  voice:
    mode: xvector
    seed: 42
    instruct: 'insufferable arrogant and whiney '
    sample_text: ''
    sample: voices/liam's dad.wav
    vector: vectors/liam's dad.npy
  portrait: portraits/liam's dad.png

# Aliases let a script speaker name resolve to a cast id when they differ.
# (e.g. the script's "Young weaver" is the pre-radical Becker.)
- id: kara
  name: Kara
  world: modern
  role: supporting
  medium: ai-video
  live: false
  description: Head of Product, Kristina's boss; reports to the CEO. The last sane skeptic with power — dry, seasoned, protective of what is real, and it will not matter.
  voice:
    mode: xvector
    seed: 646
    instruct: 'A woman in her early fifties, American — unmistakably a female voice, a warm low alto register. Head of product energy: fast-paced, excited, animated delivery, big enthusiasm, punchy emphasis, thinks out loud at speed. Mature, seasoned, commanding, but clearly a woman throughout. Conversational, not a narrator.'
    sample_text: I woke up to six of them overnight. Six! They are all incredibly long, and they all sound like ChatGPT. Does he not have anything better to do?
    sample: voices/kara.wav
    vector: vectors/kara.npy
aliases:
  young weaver: becker
  the pr: ""
  launch dashboard: ""
